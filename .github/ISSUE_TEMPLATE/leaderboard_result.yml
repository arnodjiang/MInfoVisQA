name: Leaderboard result
description: Submit a reproducible MStructQA evaluation result.
title: "[Leaderboard] Model name"
labels: []
body:
  - type: input
    id: model
    attributes:
      label: Exact model identifier and version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Dataset revision and evaluation configuration
      description: Include provider, inference settings, prompt version, Judge model/settings, total QA, failures and Judge errors. Never include API keys.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and reproducibility artifacts
      description: Link all 70 configuration scores, XQA/LQA/AVG aggregates, and sanitized prediction/usage artifacts. Include the model card and license for open weights.
    validations:
      required: true
